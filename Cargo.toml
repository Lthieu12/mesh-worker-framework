[package]
name = "mesh-worker-framework"
version = "0.9.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
serial_test = "3"

[[example]]
name = "getting_started"
path = "examples/getting_started/main.rs"

[[example]]
name = "runtime_overhead_benchmark"
path = "examples/benchmarks/runtime_overhead_benchmark.rs"