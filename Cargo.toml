[package]
name = "mwf"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
description = "Mesh Worker Framework (MWF) is a Rust Tokio/Futures-based runtime for building applications composed of long-running software workers that communicate through asynchronous messages."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/mwf"
repository = "https://github.com/Lthieu12/mesh-worker-framework"
keywords = ["async", "tokio", "worker", "messaging", "actor"]
categories = ["asynchronous", "concurrency", "development-tools::debugging"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
serial_test = "3"

[[example]]
name = "getting_started"
path = "examples/getting_started/main.rs"

[[example]]
name = "getting_started_with_logging"
path = "examples/getting_started_with_logging/main.rs"

[[example]]
name = "getting_started_with_error_handling"
path = "examples/getting_started_with_error_handling/main.rs"

[[example]]
name = "message_flow_with_logging"
path = "examples/message_flow_with_logging/main.rs"

[[example]]
name = "runtime_overhead_benchmark"
path = "examples/benchmarks/runtime_overhead_benchmark.rs"

[lints.clippy]
expect_fun_call = "allow"
single_match = "allow"
collapsible_if = "allow"